<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day Counter</title>
  <link rel="stylesheet" href="styles.css">
  <!-- FontAwesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <!-- Logo Section -->
    <div class="logo">
      <img src="picicon.png" alt="Logo" />
    </div>
    <h1><i class="fas fa-calendar-day"></i> Day Counter</h1>
    <div id="form-container">
      <form id="date-form">
        <!-- Start Date with Icon -->
        <div class="input-group">
          <label for="start-date"><i class="fas fa-calendar-alt"></i> Start Date:</label>
          <input type="date" id="start-date" required>
        </div>
        <!-- Start Time with Icon -->
        <div class="input-group">
          <label for="start-time"><i class="fas fa-clock"></i> Start Time:</label>
          <div class="time-picker">
          <select id="hour" required>
            <option value="" disabled selected>HH</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
          :
          <!-- Dropdown for minutes -->
          <select id="minute" required>
            <option value="" disabled selected>MM</option>
            <option value="00">00</option>
            <option value="01">01</option>
            <option value="02">02</option>
            <option value="03">03</option>
            <option value="04">04</option>
            <option value="05">05</option>
            <option value="06">06</option>
            <option value="07">07</option>
            <option value="08">08</option>
            <option value="09">09</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>
            <option value="24">24</option>
            <option value="25">25</option>
            <option value="26">26</option>
            <option value="27">27</option>
            <option value="28">28</option>
            <option value="29">29</option>
            <option value="30">30</option>
            <option value="31">31</option>
            <option value="32">32</option>
            <option value="33">33</option>
            <option value="34">34</option>
            <option value="35">35</option>
            <option value="36">36</option>
            <option value="37">37</option>
            <option value="38">38</option>
            <option value="39">39</option>
            <option value="40">40</option>
            <option value="41">41</option>
            <option value="42">42</option>
            <option value="43">43</option>
            <option value="44">44</option>
            <option value="45">45</option>
            <option value="46">46</option>
            <option value="47">47</option>
            <option value="48">48</option>
            <option value="49">49</option>
            <option value="50">50</option>
            <option value="51">51</option>
            <option value="52">52</option>
            <option value="53">53</option>
            <option value="54">54</option>
            <option value="55">55</option>
            <option value="56">56</option>
            <option value="57">57</option>
            <option value="58">58</option>
            <option value="59">59</option>
          </select>

            <select id="ampm" required>
              <option value="AM">AM</option>
              <option value="PM">PM</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn-primary"><i class="fas fa-play-circle"></i> Start Counter</button>
      </form>
    </div>
    <div id="timer-container" style="display: none;">
      <h2><i class="fas fa-hourglass-half"></i> Elapsed Time</h2>
      <p id="elapsed-time"></p>
      <button id="reset-button" class="btn-secondary"><i class="fas fa-redo"></i> Reset Timer</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
